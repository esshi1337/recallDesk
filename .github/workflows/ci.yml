name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:browser
      - run: npx playwright install --with-deps chromium
      - name: Browser persistence and recovery
        run: node --import tsx scripts/browser-smoke.mjs
      - name: Responsive browser workflows
        run: node scripts/mobile-smoke.mjs
